name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    uses: yaniv120892/dev-config/.github/workflows/node-ci.yml@v0.1.6

  integration:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_accounts
          POSTGRES_PASSWORD: my_accounts
          POSTGRES_DB: my_accounts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_accounts -d my_accounts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://my_accounts:my_accounts@localhost:5432/my_accounts_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run test:integration

  e2e:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: my_accounts
          POSTGRES_PASSWORD: my_accounts
          POSTGRES_DB: my_accounts_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_accounts -d my_accounts_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://my_accounts:my_accounts@localhost:5432/my_accounts_e2e_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
