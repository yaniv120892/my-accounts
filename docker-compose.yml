services:
  postgres:
    image: postgres:17-alpine
    container_name: my-accounts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: my_accounts
      POSTGRES_PASSWORD: my_accounts
      POSTGRES_DB: my_accounts_dev
    ports:
      - '5436:5432'
    volumes:
      - my-accounts-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U my_accounts -d my_accounts_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my-accounts-postgres-data:
